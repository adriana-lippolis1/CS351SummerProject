<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="samantharobinson" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/style.css" type="text/css" rel="stylesheet" />
    <title>Homepage</title>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="container header-container">
        <div class="logo-header">
          <a href="/" class="homepage-btn">Homepage</a>
        </div>

        <div class="header-actions" id="headerActions">
          <span id="userBadge" class="user-badge" style="display:none"></span>
          <button id="openPostBtn" class="create-post-btn" title="Create Post" style="display:none">
            <i class="fas fa-plus"></i>
          </button>
          <button id="logoutBtn" class="logout-btn" style="display:none">Logout</button>
        </div>
      </div>
    </header>

    <!-- Feed Section -->
    <section class="feed">
      <div class="container">
        <div class="posts-container" id="postsContainer">
          <!-- Posts injected here -->
        </div>
      </div>
    </section>

    <!-- Modal for creating a post -->
    <div id="createPostModal" class="modal">
      <div class="modal-content">
        <span id="closePostModal" class="close">&times;</span>
        <h3>Create a Post</h3>
        <form id="postForm">
          <input type="text" id="postSubject" placeholder="Subject" required />
          <textarea id="postContent" placeholder="Write your post..." required></textarea>
          <button type="submit">Post</button>
        </form>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
